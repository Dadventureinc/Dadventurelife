<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dadventure — Where Adventure Meets Fatherhood</title>
  <meta name="description" content="Dadventure is a fatherhood lifestyle brand and media platform. Coming soon.">

  <!-- Kit (ConvertKit) script for the email signup form -->
  <script src="https://f.convertkit.com/ckjs/ck.5.js"></script>

  <style>
    /* ===== EDIT COLORS HERE ===== */
    :root {
      --color-bg: #0a0a14;           /* dark navy/black background */
      --color-text: #ffffff;          /* main white text */
      --color-muted: #9ca3af;         /* gray for subtitle text */
      --color-orange: #f97316;        /* brand orange */
      --color-pink: #d946ef;          /* brand pink/magenta */
      --color-purple: #8b5cf6;        /* brand purple */
      --color-teal: #14b8a6;          /* brand teal */
      --color-border: rgba(255,255,255,0.15); /* subtle borders */
    }

    /* ===== BASE STYLES ===== */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--color-bg);
      color: var(--color-text);
      font-family: Georgia, 'Times New Roman', serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      line-height: 1.5;
    }

    .container {
      max-width: 560px;
      width: 100%;
      text-align: center;
    }

    /* ===== LOGO ===== */
    .logo {
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-size: clamp(2.5rem, 8vw, 4.5rem);
      font-weight: 900;
      letter-spacing: -0.04em;
      margin-bottom: 1.5rem;
    }

    .logo .dad {
      color: var(--color-orange);
    }

    .logo .venture {
      color: var(--color-text);
    }

    /* ===== TAGLINE ===== */
    .tagline {
      font-size: clamp(1.1rem, 2.5vw, 1.4rem);
      font-style: italic;
      color: var(--color-muted);
      margin-bottom: 3rem;
    }

    /* ===== COMING SOON ===== */
    .coming-soon {
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      background: linear-gradient(90deg, var(--color-orange), var(--color-pink), var(--color-purple));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 3rem;
    }

    /* ===== DIVIDER ===== */
    .divider {
      width: 60px;
      height: 1px;
      background: var(--color-border);
      margin: 0 auto 3rem;
    }

    /* ===== EMAIL SIGNUP SECTION ===== */
    .signup-heading {
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: var(--color-text);
    }

    .signup-subtext {
      font-size: 0.95rem;
      color: var(--color-muted);
      margin-bottom: 1.75rem;
    }

    /* ===== KIT FORM OVERRIDES ===== */
    .formkit-form {
      max-width: 100% !important;
      margin: 0 auto;
    }

    .formkit-fields {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .formkit-input {
      width: 100% !important;
      padding: 0.95rem 1rem !important;
      font-size: 1rem !important;
      font-family: Georgia, serif !important;
      border: 1px solid var(--color-border) !important;
      border-radius: 8px !important;
      background: rgba(255,255,255,0.04) !important;
      color: var(--color-text) !important;
      transition: border-color 0.2s, background 0.2s !important;
    }

    .formkit-input::placeholder {
      color: var(--color-muted) !important;
      opacity: 1 !important;
    }

    .formkit-input:focus {
      outline: none !important;
      border-color: var(--color-orange) !important;
      background: rgba(255,255,255,0.06) !important;
    }

    .formkit-submit {
      width: 100% !important;
      background: linear-gradient(90deg, var(--color-teal), var(--color-orange)) !important;
      color: #0a0a14 !important;
      border: none !important;
      border-radius: 8px !important;
      padding: 0.95rem 1rem !important;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif !important;
      font-size: 0.95rem !important;
      font-weight: 700 !important;
      letter-spacing: 0.05em !important;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    .formkit-submit:hover {
      opacity: 0.92;
    }

    .formkit-submit:active {
      transform: scale(0.98);
    }

    .formkit-submit > span {
      padding: 0 !important;
    }

    /* Hide the "Built with Kit" link */
    .formkit-powered-by-convertkit-container {
      display: none !important;
    }

    /* Success/error messages */
    .formkit-alert {
      background: rgba(255,255,255,0.04) !important;
      border: 1px solid var(--color-border) !important;
      color: var(--color-text) !important;
      border-radius: 8px !important;
      padding: 0.85rem !important;
      font-size: 0.95rem !important;
      margin-bottom: 1rem !important;
    }

    .formkit-alert-success {
      background: rgba(20, 184, 166, 0.15) !important;
      border-color: var(--color-teal) !important;
    }
  </style>
</head>
<body>

  <main class="container">

    <!-- ===== LOGO (edit text here) ===== -->
    <h1 class="logo"><span class="dad">Dad</span><span class="venture">venture</span></h1>

    <!-- ===== TAGLINE (edit text here) ===== -->
    <p class="tagline">Where adventure meets fatherhood.</p>

    <!-- ===== COMING SOON (edit text here) ===== -->
    <p class="coming-soon">Coming Soon</p>

    <div class="divider"></div>

    <!-- ===== EMAIL SIGNUP HEADING (edit text here) ===== -->
    <h2 class="signup-heading">Subscribe to our email list</h2>
    <p class="signup-subtext">Be the first to know when we launch.</p>

    <!-- ===== KIT EMAIL FORM — DO NOT EDIT ===== -->
    <form action="https://app.kit.com/forms/9447538/subscriptions" class="seva-form formkit-form" method="post" data-sv-form="9447538" data-uid="8fcc47066a" data-format="inline" data-version="5">
      <div data-style="clean">
        <ul class="formkit-alert formkit-alert-error" data-element="errors" data-group="alert"></ul>
        <div data-element="fields" data-stacked="false" class="seva-fields formkit-fields">
          <div class="formkit-field">
            <input class="formkit-input" name="email_address" aria-label="Email Address" placeholder="Email address" required="" type="email">
          </div>
          <button data-element="submit" class="formkit-submit formkit-submit">
            <div class="formkit-spinner"><div></div><div></div><div></div></div>
            <span>Subscribe</span>
          </button>
        </div>
      </div>
    </form>

  </main>

</body>
</html>
